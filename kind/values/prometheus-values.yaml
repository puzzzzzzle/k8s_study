# kube-prometheus-stack 自定义配置
# 适配 kind 本地集群环境

# Grafana 配置
grafana:
  adminPassword: prom-operator
  service:
    type: ClusterIP
  # 持久化存储（kind 环境使用 emptyDir 足够）
  persistence:
    enabled: false
  # 默认数据源
  defaultDashboardsEnabled: true
  defaultDashboardsTimezone: "Asia/Shanghai"

# Prometheus 配置
prometheus:
  prometheusSpec:
    # ServiceMonitor 选择器：扫描所有命名空间
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}
    # PodMonitor 选择器
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorSelector: {}
    podMonitorNamespaceSelector: {}
    # 资源限制（本地开发适当控制）
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    # 数据保留
    retention: 7d
    # 存储（本地开发不需要 PV）
    storageSpec: {}

# AlertManager 配置
alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

# node-exporter（kind 环境精简资源）
nodeExporter:
  resources:
    requests:
      cpu: 50m
      memory: 30Mi
    limits:
      cpu: 100m
      memory: 50Mi

# kube-state-metrics
kubeStateMetrics:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

# 禁用不适用于 kind 的组件
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
