# kind 集群配置文件
# 1 control-plane + 3 worker 节点
# 配置本地 registry 信任 + Gateway 端口映射
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: dev
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    # 将宿主机端口映射到 control-plane，用于 Gateway 入口
    # 宿主机 80/443 有其他用途，映射到 10080/10443
    extraPortMappings:
      - containerPort: 80
        hostPort: 10080
        protocol: TCP
      - containerPort: 443
        hostPort: 10443
        protocol: TCP
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
      # gRPC 独立端口（备用，当前 gRPC 复用 30080 http 入口）
      - containerPort: 30051
        hostPort: 30051
        protocol: TCP
  - role: worker
  - role: worker
  - role: worker

# 让所有节点信任本地 insecure registry
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
