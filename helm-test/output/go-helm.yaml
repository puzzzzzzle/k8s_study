---
# Source: web-demo/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: go-pingpong
  labels:
    helm.sh/chart: web-demo-0.1.0
    app.kubernetes.io/name: go-pingpong
    app.kubernetes.io/instance: release-name
    app.kubernetes.io/managed-by: Helm
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: go-pingpong
    app.kubernetes.io/instance: release-name
---
# Source: web-demo/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-pingpong
  labels:
    helm.sh/chart: web-demo-0.1.0
    app.kubernetes.io/name: go-pingpong
    app.kubernetes.io/instance: release-name
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: go-pingpong
      app.kubernetes.io/instance: release-name
  template:
    metadata:
      labels:
        app.kubernetes.io/name: go-pingpong
        app.kubernetes.io/instance: release-name
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: app
          image: "go-pingpong:2026-05-23-19-42-40"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
---
# Source: web-demo/templates/gateway.yaml
# GatewayClass：声明使用 Envoy Gateway 控制器
# 集群级资源，通常只需创建一次；这里通过开关控制是否由 Chart 管理
---
# Source: web-demo/templates/gateway.yaml
# Gateway：定义监听端口和协议
---
# Source: web-demo/templates/gateway.yaml
# HTTPRoute：将流量路由到后端 Service
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: go-pingpong
  namespace: default
  labels:
    helm.sh/chart: web-demo-0.1.0
    app.kubernetes.io/name: go-pingpong
    app.kubernetes.io/instance: release-name
    app.kubernetes.io/managed-by: Helm
spec:
  parentRefs:
  - name: demo-gateway
    namespace: default
  hostnames:
  - "go.demo.local"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /ping
    backendRefs:
    - name: go-pingpong
      port: 8080
  - matches:
    - path:
        type: Exact
        value: /healthz
    backendRefs:
    - name: go-pingpong
      port: 8080
  - matches:
    - path:
        type: Exact
        value: /metrics
    backendRefs:
    - name: go-pingpong
      port: 8080
---
# Source: web-demo/templates/service-monitor.yaml
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: go-pingpong
  namespace: monitoring
  labels:
    helm.sh/chart: web-demo-0.1.0
    app.kubernetes.io/name: go-pingpong
    app.kubernetes.io/instance: release-name
    app.kubernetes.io/managed-by: Helm
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: go-pingpong
      app.kubernetes.io/instance: release-name
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
  namespaceSelector:
    any: true
