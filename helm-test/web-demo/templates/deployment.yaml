apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "web-demo.fullname" . }}
  labels:
    {{- include "web-demo.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "web-demo.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "web-demo.selectorLabels" . | nindent 8 }}
      {{- if .Values.metrics.enabled }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.metrics.port }}"
        prometheus.io/path: "{{ .Values.metrics.path }}"
      {{- end }}
    spec:
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: {{ .Values.service.portName | default "http" }}
              containerPort: {{ .Values.containerPort | default .Values.service.port }}
              protocol: TCP
            {{- if and .Values.metrics.enabled (ne ((.Values.metrics).port | default 0 | int) (.Values.service.port | int)) (not .Values.nginx.enabled) }}
            - name: http-metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- end }}
          {{- if .Values.env }}
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- end }}
          {{- if or .Values.nginx.enabled .Values.sharedVolume.enabled }}
          volumeMounts:
            {{- if .Values.nginx.enabled }}
            - name: html-volume
              mountPath: /usr/share/nginx/html
            - name: nginx-status-conf
              mountPath: /etc/nginx/conf.d/status.conf
              subPath: status.conf
            {{- end }}
            {{- if .Values.sharedVolume.enabled }}
            - name: shared-config
              mountPath: {{ .Values.sharedVolume.mountPath }}
              readOnly: {{ .Values.sharedVolume.readOnly }}
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
        {{- if and .Values.nginx.enabled .Values.metrics.enabled }}
        - name: nginx-exporter
          image: "nginx/nginx-prometheus-exporter:1.4"
          args:
            - --nginx.scrape-uri=http://localhost:8080/stub_status
          ports:
            - name: http-metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
          resources:
            limits:
              cpu: 50m
              memory: 32Mi
            requests:
              cpu: 10m
              memory: 16Mi
        {{- end }}
      {{- if or .Values.nginx.enabled .Values.sharedVolume.enabled }}
      volumes:
        {{- if .Values.nginx.enabled }}
        - name: html-volume
          configMap:
            name: {{ include "web-demo.fullname" . }}-html
        - name: nginx-status-conf
          configMap:
            name: {{ include "web-demo.fullname" . }}-html
            items:
              - key: status.conf
                path: status.conf
        {{- end }}
        {{- if .Values.sharedVolume.enabled }}
        - name: shared-config
          persistentVolumeClaim:
            claimName: {{ .Values.sharedVolume.claimName }}
            readOnly: {{ .Values.sharedVolume.readOnly }}
        {{- end }}
      {{- end }}
