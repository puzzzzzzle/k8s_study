{{- if .Values.gateway.enabled }}
---
# HTTPRoute：将流量路由到后端 Service
# 公共基础设施（GatewayClass + Gateway）由独立的 gateway.yaml 管理，不在此模板中创建
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "web-demo.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "web-demo.labels" . | nindent 4 }}
spec:
  parentRefs:
  - name: {{ .Values.gateway.name | default (printf "%s-gateway" (include "web-demo.fullname" .)) }}
    namespace: {{ .Release.Namespace }}
  {{- if .Values.gateway.hostname }}
  hostnames:
  - {{ .Values.gateway.hostname | quote }}
  {{- end }}
  rules:
  {{- if .Values.gateway.routes }}
  {{- range .Values.gateway.routes }}
  - matches:
    - path:
        type: {{ .pathType | default "PathPrefix" }}
        value: {{ .path | default "/" }}
    {{- if .headers }}
    {{- range .headers }}
    - headers:
      - name: {{ .name }}
        value: {{ .value }}
    {{- end }}
    {{- end }}
    backendRefs:
    - name: {{ include "web-demo.fullname" $ }}
      port: {{ $.Values.service.port }}
    {{- if .filters }}
    filters:
      {{- toYaml .filters | nindent 4 }}
    {{- end }}
  {{- end }}
  {{- else }}
  # 默认路由：所有流量转发到服务
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: {{ include "web-demo.fullname" . }}
      port: {{ .Values.service.port }}
  {{- end }}
{{- end }}
