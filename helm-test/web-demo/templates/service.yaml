apiVersion: v1
kind: Service
metadata:
  name: {{ include "web-demo.fullname" . }}
  labels:
    {{- include "web-demo.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.portName | default "http" }}
      protocol: TCP
      name: {{ .Values.service.portName | default "http" }}
      {{- if .Values.service.appProtocol }}
      appProtocol: {{ .Values.service.appProtocol }}
      {{- end }}
    {{- if and .Values.metrics.enabled (ne ((.Values.metrics).port | default 0 | int) (.Values.service.port | int)) }}
    - port: {{ .Values.metrics.port }}
      targetPort: http-metrics
      protocol: TCP
      name: http-metrics
    {{- end }}
  selector:
    {{- include "web-demo.selectorLabels" . | nindent 4 }}
