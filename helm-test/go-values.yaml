# Go ping/pong API 演示
name: "go-pingpong"

replicaCount: 1

image:
  repository: localhost:5001/go-pingpong   # minikube 本地镜像（需先执行 docker build + minikube image load）
  tag: 20260525-160025
  pullPolicy: IfNotPresent         # 使用本地镜像，不拉取远端

service:
  port: 8080

nginx:
  enabled: false            # 纯容器模式，无 HTML ConfigMap，无 nginx-exporter

metrics:
  enabled: true
  port: 8080                # Go 应用在同一端口原生暴露 /metrics
  path: /metrics

# Envoy Gateway 入口（公共基础设施由 gateway.yaml 管理）
gateway:
  enabled: true
  name: demo-gateway              # 引用已有的 Gateway
  # hostname 留空 = 纯 path 路由，可直接 curl localhost:30080/ping
  routes:
  - path: /ping
    pathType: PathPrefix
