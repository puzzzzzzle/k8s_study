# Go ping/pong API 演示
name: "go-pingpong"

replicaCount: 1

image:
  repository: go-pingpong   # minikube 本地镜像（需先执行 docker build + minikube image load）
  tag: 2026-05-23-19-42-40
  pullPolicy: IfNotPresent         # 使用本地镜像，不拉取远端

service:
  port: 8080

nginx:
  enabled: false            # 纯容器模式，无 HTML ConfigMap，无 nginx-exporter

metrics:
  enabled: true
  port: 8080                # Go 应用在同一端口原生暴露 /metrics
  path: /metrics
