apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nginx-demo.fullname" . }}-html
  labels:
    {{- include "nginx-demo.labels" . | nindent 4 }}
data:
  index.html: |
    {{- .Values.html.content | nindent 4 }}
  {{- if .Values.metrics.enabled }}
  status.conf: |
    server {
      listen 8080;
      location /stub_status {
        stub_status on;
        allow 127.0.0.1;
        deny all;
      }
    }
  {{- end }}
